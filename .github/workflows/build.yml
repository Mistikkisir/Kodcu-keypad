
name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Use older NDK (NDK 29 / Clang 21 breaks fmt)
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/27.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then NDK=$(ls -d /usr/local/lib/android/sdk/ndk/26.* 2>/dev/null | sort -V | tail -1); fi
          echo "Available NDKs:"; ls /usr/local/lib/android/sdk/ndk
          echo "Chosen NDK: $NDK"
          if [ -n "$NDK" ]; then
            echo "ANDROID_NDK_LATEST_HOME=$NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV
            echo "ANDROID_NDK=$NDK" >> $GITHUB_ENV
          fi

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
